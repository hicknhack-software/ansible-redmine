---
- name: Install packages
  ansible.builtin.apt:
    pkg: "{{ redmine_time_tracker_packages }}"
    update_cache: true
    state: present
    cache_valid_time: 86400
  become: true
  become_user: "root"
  when: (provisioned is defined)
    and (provisioned | bool)

- name: Git
  ansible.builtin.git:
    repo: "{{ redmine_time_tracker_git_repo }}"
    version: "{{ redmine_time_tracker_git_version }}"
    dest: "{{ redmine_plugins_folder }}/{{ redmine_time_tracker_plugin_name }}"
  register: redmine_plugin_time_tracker_result
  notify: Restart rails app

- name: Fact
  ansible.builtin.set_fact:
    REDMINE_BUNDLE: true
    REDMINE_PLUGIN_MIGRATE: true
  when: redmine_plugin_time_tracker_result.changed and true
